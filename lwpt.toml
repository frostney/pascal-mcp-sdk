# pascal-mcp-sdk — FreePascal-native MCP (Model Context Protocol) server library.
# Bootstrapped with `lwpt init`; built/tested/formatted via lwpt.

[package]
name = "pascal-mcp-sdk"
version = "2.0.0"
# lwpt (0.2.0+) discovers dep units through nested manifests, so only
# pascal-mcp-sdk's own source dir is listed here. Dep test files are
# excluded at fetch time so `lwpt test` (which walks every units dir)
# only discovers pascal-mcp-sdk's own suites; [format] likewise excludes
# .lwpt so the formatter never rewrites fetched modules out from under
# the lockfile hash.
units = ["source/units"]

[format]
exclude = [".lwpt/**"]

[dependencies]
# Dev-time only: the runtime library is RTL + fpjson, zero third-party
# dependencies (see docs/internals/architecture.md). testing is the co-located
# *.Test.pas framework; resolved from the lwpt 0.6.0 release tag via an
# include filter (one filtered fetch per package), mirroring duetto —
# the same tag the toolchain binary is pinned to (CI's LWPT_VERSION).
testing = { source = "frostney/lwpt", version = "^0.6.0", include = ["packages/testing/**"], exclude = ["**/*.Test.pas"] }

[build]
mcpdemo  = { source = "source/apps/mcpdemo.pas",  output = "build/mcpdemo" }
mcpsmoke = { source = "source/apps/mcpsmoke.pas", output = "build/mcpsmoke" }

# `lwpt run smoke` — the E2E battery against the binaries `lwpt build`
# produced. Run-scripts execute via InstantFPC without project include
# paths, so the script is a self-contained wrapper, not mcpsmoke itself.
# (lwpt 0.6.0 syntax: explicit command + args replaced `script = ...`.)
[smoke]
command = "instantfpc"
args = ["scripts/smoke.pas"]

# Complexity ceilings enforced by `lwpt health` (CI gate). Ratchet
# values: set just above the 2026-08-15 baseline (worst routine
# validatesubsetarguments at cyclomatic 26 / cognitive 85; worst file
# MCP.Server.pas at 541/600) so the numbers can shrink but not grow
# unnoticed. Hotspot scoring needs full git history, which CI's
# shallow checkout lacks — deliberately not limited.
[health]
max-routine-cyclomatic = 30
max-routine-cognitive = 90
max-file-cyclomatic = 600
max-file-cognitive = 650

# Token-clone ceiling for `lwpt duplication` (CI gate); baseline
# 1.59% across 6 clone groups.
[duplication]
maximum-percent = 3

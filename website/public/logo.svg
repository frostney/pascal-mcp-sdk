<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- pascal-mcp-sdk mark: Pascal's triangle — three edges, three
       vertex nodes, and the fainter first node of the next row. Pictorial only (no wordmark);
       reads at 16px; inherits currentColor so it works on light and
       dark backgrounds. -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M16 7.5 L9.5 18.5" />
    <path d="M16 7.5 L22.5 18.5" />
    <path d="M9.5 18.5 L22.5 18.5" />
  </g>
  <g fill="currentColor">
    <circle cx="16" cy="6" r="3.4" />
    <circle cx="8.5" cy="20" r="3.4" />
    <circle cx="23.5" cy="20" r="3.4" />
  </g>
  <circle cx="16" cy="26" r="2.4" fill="currentColor" opacity="0.45" />
</svg>

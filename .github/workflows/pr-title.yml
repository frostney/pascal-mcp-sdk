name: PR title

# The repository squash-merges, so a PR's title becomes the squash
# commit's subject — and therefore the CHANGELOG entry git-cliff
# generates from it. This gate keeps that title a Conventional Commit.
#
# Why it exists: PR #38 was titled "Implement all remaining open
# issues: ..." and shipped the whole HTTP-era release; git-cliff could
# not classify the subject, so the generated changelog omitted every
# feature in it and `--bumped-version` proposed a patch bump for a
# release carrying a breaking change (caught while cutting 2.0.0).
#
# Deliberately its own workflow rather than a job in pr.yml: title
# validation needs the `edited` event, and adding that to pr.yml would
# re-run the full three-platform build/test matrix on every title or
# description edit. The accepted types are read from cliff.toml by the
# checker, so this gate cannot drift from the changelog generator.
#
# The gate only means anything while the repository's squash-merge
# title source is PR_TITLE. Under GitHub's other setting,
# COMMIT_OR_PR_TITLE, a single-commit PR is squashed using the
# *commit's* subject and the validated title never reaches the
# changelog — the gate silently becomes inert for the most common
# shape of PR (this repository was configured that way until
# 2026-08-09). The first step below asserts the setting so that drift
# fails loudly instead of quietly reopening the hole.

on:
  pull_request:
    branches:
      - main
    # `edited` covers title changes; the rest keep the check reported
    # on every update so it stays valid as a required status check.
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify the squash subject comes from the PR title
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE=$(gh api "repos/${GITHUB_REPOSITORY}" \
            --jq .squash_merge_commit_title)
          echo "squash_merge_commit_title: ${SOURCE}"
          if [ "${SOURCE}" != "PR_TITLE" ]; then
            echo "::error::squash_merge_commit_title is ${SOURCE}, not PR_TITLE — a single-commit PR would be squashed using its commit subject, so validating the title here would not protect the changelog."
            echo "Restore it under Settings → General → Pull Requests →"
            echo "'Default to PR title for squash merge commits', or extend"
            echo "this workflow to validate commit subjects as well."
            exit 1
          fi

      - name: Check PR title is a Conventional Commit
        # The title is attacker-controlled: pass it through the
        # environment, never interpolated into the shell command.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/check-pr-title.py

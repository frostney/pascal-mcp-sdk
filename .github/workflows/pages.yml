name: Pages

# Landing page + rendered docs at
# https://frostney.github.io/pascal-mcp-sdk/ (issue #6). The site
# renders the repository's docs/ tree directly, so both website/ and
# docs/ changes rebuild it. PRs touching those paths build the site
# (catching breakage — the link mapper fails the build on broken
# internal links) without deploying; pushes to main deploy.

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths:
      - "website/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # Node pin recorded in docs/internals/tooling.md.
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install site dependencies
        working-directory: website
        run: npm ci

      - name: Install Chromium (build-time Mermaid rendering)
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Build (static export; broken doc links fail here)
        working-directory: website
        run: npm run build

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

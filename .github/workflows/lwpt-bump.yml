name: lwpt weekly bump

# Checks frostney/lwpt for a newer release than the repo's pin and
# opens a PR carrying the complete bump: LWPT_VERSION in both CI
# workflows, the same-tag testing dependency in lwpt.toml, the
# regenerated lwpt.cfg/lwpt.lock and committed zero-install trees
# (.lwpt/modules + .lwpt/archives, stale archives pruned), and the
# regenerated AGENTS.md command block.
#
# Dependabot was evaluated and cannot do this (2026-08-15): it has no
# custom/regex version managers, cannot track GitHub Releases of an
# arbitrary repository, and — decisively — cannot run `lwpt install`
# to regenerate the lockfile and committed module trees, without
# which a version bump is incomplete.
#
# Two-job shape on purpose: the bump job downloads and executes the
# new lwpt release binary (checksum-verified), so it runs with
# read-only permissions and hands the result over as an artifact;
# only the publish job holds write permissions and executes nothing
# fetched. A failing bump job (e.g. a breaking manifest-syntax
# change, as in 0.5.1 → 0.6.0) is the signal to migrate by hand.
#
# Note: PRs opened with the default GITHUB_TOKEN do not trigger
# pull_request workflows — close/reopen the PR (or push to its
# branch) to run CI on it.
#
# Cadence: weekly (Mondays 07:00 UTC). Manual trigger available via
# workflow_dispatch.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: lwpt-weekly-bump
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      version: ${{ steps.latest.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - id: latest
        name: Compare latest release against the pin
        run: |
          latest=$(gh api repos/frostney/lwpt/releases/latest --jq .tag_name)
          current=$(grep -m1 'LWPT_VERSION:' .github/workflows/pr.yml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "lwpt pin: $current, latest release: $latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the new lwpt release (checksum-verified)
        if: steps.latest.outputs.version != steps.latest.outputs.current
        run: |
          v="${{ steps.latest.outputs.version }}"
          base="https://github.com/frostney/lwpt/releases/download/$v"
          curl -fsSLO "$base/lwpt-$v-linux-x64.tar.gz"
          curl -fsSLO "$base/lwpt-$v-checksums.txt"
          sha256sum -c <(grep "lwpt-$v-linux-x64.tar.gz" "lwpt-$v-checksums.txt")
          tar xzf "lwpt-$v-linux-x64.tar.gz"
          echo "$PWD/lwpt-$v-linux-x64" >> "$GITHUB_PATH"
          rm "lwpt-$v-linux-x64.tar.gz" "lwpt-$v-checksums.txt"

      - name: Apply the bump
        if: steps.latest.outputs.version != steps.latest.outputs.current
        run: |
          v="${{ steps.latest.outputs.version }}"
          sed -i "s/LWPT_VERSION: \"[^\"]*\"/LWPT_VERSION: \"$v\"/" \
            .github/workflows/pr.yml .github/workflows/ci.yml
          # testing resolves from the same release tag as the
          # toolchain (AGENTS.md rule).
          sed -i "s/\(testing = { source = \"frostney\/lwpt\", version = \"\^\)[^\"]*\"/\1$v\"/" lwpt.toml
          # Stale archives are not pruned by install; drop them so the
          # committed zero-install tree carries exactly the new tag.
          rm -f .lwpt/archives/*.tar.gz
          lwpt install
          lwpt install --frozen
          lwpt agents
          rm -rf "lwpt-$v-linux-x64"

      - id: changed
        run: |
          if [ "${{ steps.latest.outputs.version }}" = "${{ steps.latest.outputs.current }}" ] || \
             [ -z "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "lwpt already pinned to the latest release; no PR to open."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package the bump
        if: steps.changed.outputs.changed == 'true'
        run: |
          tar -cf lwpt-bump.tar \
            .github/workflows/pr.yml .github/workflows/ci.yml \
            lwpt.toml lwpt.cfg lwpt.lock .lwpt/modules .lwpt/archives \
            AGENTS.md

      - name: Upload the bump
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lwpt-bump
          path: lwpt-bump.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download the bump
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lwpt-bump

      - name: Apply the bump
        run: |
          rm -rf .lwpt/modules .lwpt/archives
          tar -xf lwpt-bump.tar
          rm lwpt-bump.tar
          if [ -z "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo "Bump artifact contains no repository changes."
            exit 1
          fi

      - name: Open or update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/lwpt-bump
          commit-message: "chore: bump lwpt to ${{ needs.bump.outputs.version }}"
          title: "chore: bump lwpt to ${{ needs.bump.outputs.version }}"
          body: |
            Automated bump of the lwpt toolchain pin to `${{ needs.bump.outputs.version }}`:
            `LWPT_VERSION` on both CI workflows, the same-tag `testing` dependency,
            regenerated `lwpt.cfg`/`lwpt.lock` and committed zero-install trees
            (stale archives pruned), and the refreshed AGENTS.md command block.

            `lwpt install --frozen` was verified during the bump; review the
            [release notes](https://github.com/frostney/lwpt/releases/tag/${{ needs.bump.outputs.version }})
            and let CI run the full gate before merging.

            Cron: weekly, Mondays 07:00 UTC. See `.github/workflows/lwpt-bump.yml`.
          labels: automated

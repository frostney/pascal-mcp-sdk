name: agent skills weekly bump

# Refreshes the lock-managed project skills (skills-lock.json +
# .agents/skills; .claude/skills is a symlink into that tree) from
# their upstream repositories and opens a PR when the skill tree
# changes. Adapted from GocciaScript's workflow of the same name.
#
# Two-job shape on purpose: the refresh job executes freshly fetched
# upstream content, so it runs with read-only permissions and hands
# the result over as an artifact; only the publish job holds write
# permissions, and it executes nothing from upstream.
#
# Note: PRs opened with the default GITHUB_TOKEN do not trigger
# pull_request workflows — close/reopen the PR (or push to its
# branch) to run CI on it.
#
# Cadence: weekly (Mondays 08:00 UTC). Manual trigger available via
# workflow_dispatch.

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: agent-skills-weekly-bump
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Refresh lock-managed skills
        run: npx -y skills@1.5.17 update --project --yes

      - name: Verify refreshed skill inventory
        run: |
          npx -y skills@1.5.17 list --json > skill-inventory.json
          node -e '
            const fs = require("fs");
            JSON.parse(fs.readFileSync("skill-inventory.json", "utf8"));
            const lock = JSON.parse(fs.readFileSync("skills-lock.json", "utf8"));
            for (const name of Object.keys(lock.skills)) {
              if (!fs.existsSync(`.agents/skills/${name}/SKILL.md`)) {
                throw new Error(`locked skill ${name} missing from .agents/skills`);
              }
            }
          '
          rm skill-inventory.json

      - id: changed
        run: |
          if [ -z "$(git status --porcelain=v1 --untracked-files=all -- \
            .agents/skills skills-lock.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Project skills are already current; no PR to open."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package refreshed skill tree
        if: steps.changed.outputs.changed == 'true'
        run: tar -cf agent-skills-refresh.tar .agents/skills skills-lock.json

      - name: Upload refreshed skill tree
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-skills-refresh
          path: agent-skills-refresh.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download refreshed skill tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: agent-skills-refresh

      - name: Apply refreshed skill tree
        run: |
          rm -rf .agents/skills
          tar -xf agent-skills-refresh.tar
          rm agent-skills-refresh.tar
          if [ -z "$(git status --porcelain=v1 --untracked-files=all -- \
            .agents/skills skills-lock.json)" ]; then
            echo "Refreshed skill artifact contains no repository changes."
            exit 1
          fi

      - name: Open or update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/agent-skills-bump
          commit-message: "chore(skills): sync provisioned skills"
          title: "chore(skills): sync provisioned skills"
          body: |
            Automated refresh of the lock-managed project skills and `skills-lock.json`.

            Review upstream instruction changes before merging — skills are
            executable guidance for agents working in this repository.

            Cron: weekly, Mondays 08:00 UTC. See `.github/workflows/agent-skills-bump.yml`.
          labels: automated
